<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D2147">
  <title>You are offline | NG Home</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0D2147;
      color: #FAF6EE;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 650; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: #D6C9B0; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      background: #FAF6EE;
      color: #0D2147;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #9ED39A; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="72" height="72">
    <h1>You are offline</h1>
    <p>NG Home needs the internet to show your bills and payments. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back by itself once the connection returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
