<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- iOS rounded square background -->
  <rect width="1024" height="1024" rx="220" fill="#0A1F45"/>
  <!-- Gradient overlay for depth -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a6a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050e20" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#grad)"/>

  <!-- Shield (centered, ~680px tall) -->
  <g transform="translate(172, 90) scale(3.4)">
    <!-- Shield shape -->
    <path d="M100,8 L182,34 L182,128 C182,180 144,212 100,231 C56,212 18,180 18,128 L18,34 Z"
          fill="none" stroke="white" stroke-width="3" stroke-opacity="0.15"/>

    <!-- NG lettering – N -->
    <path d="M33,105 L33,52 L67,105 L67,52"
          stroke="white" stroke-width="13" fill="none"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- NG lettering – G -->
    <path d="M128,60 C121,53 112,49 100,49 C84,49 73,60 73,78 C73,97 84,108 100,108 C113,108 122,102 128,94 L128,79 L103,79"
          stroke="white" stroke-width="12" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Home roof -->
    <polygon points="100,122 128,147 72,147" fill="white"/>
    <!-- Home body -->
    <rect x="76" y="147" width="48" height="36" fill="white" rx="1"/>
    <!-- Green 2×2 grid -->
    <rect x="80" y="151" width="16" height="13" fill="#3D8C3C" rx="1.5"/>
    <rect x="100" y="151" width="16" height="13" fill="#3D8C3C" rx="1.5"/>
    <rect x="80" y="166" width="16" height="13" fill="#3D8C3C" rx="1.5"/>
    <rect x="100" y="166" width="16" height="13" fill="#3D8C3C" rx="1.5"/>

    <!-- Wrench handle -->
    <line x1="88" y1="176" x2="58" y2="200" stroke="white" stroke-width="9" stroke-linecap="round"/>
    <!-- Wrench jaw -->
    <path d="M100,158 C93,150 93,140 99,135 C105,130 114,131 119,137 L113,143 C110,140 105,141 103,144 C101,148 103,153 107,155 Z" fill="white"/>

    <!-- Green swoosh -->
    <path d="M42,198 Q100,222 158,196" stroke="#3D8C3C" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
</svg>
