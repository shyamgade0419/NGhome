<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <!-- Deep navy gradient background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D2147"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <!-- Building silhouette texture (subtle) -->
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3060" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1830" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Subtle building silhouette (background cityscape) -->
  <g fill="url(#buildingGrad)" opacity="0.3">
    <rect x="0" y="1400" width="120" height="520"/>
    <rect x="100" y="1300" width="80" height="620"/>
    <rect x="160" y="1350" width="100" height="570"/>
    <rect x="240" y="1250" width="90" height="670"/>
    <rect x="310" y="1380" width="70" height="540"/>
    <rect x="360" y="1200" width="110" height="720"/>
    <rect x="450" y="1320" width="85" height="600"/>
    <rect x="520" y="1280" width="90" height="640"/>
    <rect x="590" y="1350" width="75" height="570"/>
    <rect x="650" y="1230" width="100" height="690"/>
    <rect x="730" y="1310" width="85" height="610"/>
    <rect x="800" y="1260" width="95" height="660"/>
    <rect x="880" y="1320" width="80" height="600"/>
    <rect x="940" y="1380" width="140" height="540"/>
  </g>

  <!-- Logo group (centered vertically in upper 55%) -->
  <g transform="translate(240, 580) scale(3.0)">
    <!-- Shield shape -->
    <path d="M100,8 L182,34 L182,128 C182,180 144,212 100,231 C56,212 18,180 18,128 L18,34 Z"
          fill="#0D2147" stroke="#1e4080" stroke-width="2"/>
    <!-- Inner highlight -->
    <path d="M100,14 L176,38 L176,128 C176,176 140,207 100,225 C60,207 24,176 24,128 L24,38 Z"
          fill="none" stroke="white" stroke-width="1" stroke-opacity="0.12"/>

    <!-- N -->
    <path d="M33,105 L33,52 L67,105 L67,52"
          stroke="white" stroke-width="13" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- G -->
    <path d="M128,60 C121,53 112,49 100,49 C84,49 73,60 73,78 C73,97 84,108 100,108 C113,108 122,102 128,94 L128,79 L103,79"
          stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Home roof -->
    <polygon points="100,122 128,147 72,147" fill="white"/>
    <!-- Home body -->
    <rect x="76" y="147" width="48" height="36" fill="white" rx="1"/>
    <!-- Green 2×2 grid -->
    <rect x="80" y="151" width="16" height="13" fill="#3D8C3C" rx="1.5"/>
    <rect x="100" y="151" width="16" height="13" fill="#3D8C3C" rx="1.5"/>
    <rect x="80" y="166" width="16" height="13" fill="#3D8C3C" rx="1.5"/>
    <rect x="100" y="166" width="16" height="13" fill="#3D8C3C" rx="1.5"/>

    <!-- Wrench handle -->
    <line x1="88" y1="176" x2="58" y2="200" stroke="white" stroke-width="9" stroke-linecap="round"/>
    <!-- Wrench jaw -->
    <path d="M100,158 C93,150 93,140 99,135 C105,130 114,131 119,137 L113,143 C110,140 105,141 103,144 C101,148 103,153 107,155 Z" fill="white"/>

    <!-- Green swoosh -->
    <path d="M42,198 Q100,222 158,196" stroke="#3D8C3C" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>

  <!-- NG HOME wordmark -->
  <text x="540" y="1340" text-anchor="middle"
        fill="white" font-size="96" font-weight="700"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        letter-spacing="8">NG HOME</text>

  <!-- Society Management System subtitle -->
  <text x="540" y="1420" text-anchor="middle"
        fill="white" font-size="38" font-weight="400"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        letter-spacing="3" opacity="0.75">Society Management System</text>

  <!-- Powered by NovaGade -->
  <text x="540" y="1720" text-anchor="middle"
        fill="white" font-size="28" font-weight="300"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        letter-spacing="1" opacity="0.5">Powered by NovaGade</text>

  <!-- Green loading indicator (spinner dot at bottom) -->
  <circle cx="540" cy="1800" r="18" fill="#3D8C3C" opacity="0.9"/>
  <circle cx="540" cy="1800" r="8" fill="#0D2147" opacity="0.7"/>
</svg>
